name: ci
on:
  push:
  pull_request:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      # Heavy formulae that add nothing to the shell checks.
      HOMEBREW_BUNDLE_BREW_SKIP: "ffmpeg helm k9s stern kubernetes-cli nmap go rustup libpq magic-wormhole yt-dlp black sops age rclone sevenzip git-lfs sshpass"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expose the checkout as ~/.dotfiles
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Bootstrap and install (non-interactive)
        run: ./bootstrap.sh --none --no-gui --no-chsh --no-cargo

      - name: Shell checks
        run: tests/check-shell.sh
